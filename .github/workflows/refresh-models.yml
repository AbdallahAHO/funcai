name: Refresh Models

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

concurrency:
  group: refresh-models
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Snapshot model registries
        run: |
          mkdir -p "$RUNNER_TEMP/model-registry-baseline/src/provider/openrouter"
          mkdir -p "$RUNNER_TEMP/model-registry-baseline/src/provider/cloudflare"
          cp src/provider/openrouter/models.ts "$RUNNER_TEMP/model-registry-baseline/src/provider/openrouter/models.ts"
          cp src/provider/cloudflare/models.ts "$RUNNER_TEMP/model-registry-baseline/src/provider/cloudflare/models.ts"

      - name: Refresh model registries
        run: pnpm models:refresh

      - name: Validate refresh
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: pnpm maintenance:gate

      - name: Generate PR summary
        run: pnpm models:report -- --base-dir "$RUNNER_TEMP/model-registry-baseline" --output "$RUNNER_TEMP/model-refresh-pr.md"

      - name: Print summary for local act runs
        if: env.ACT == 'true'
        run: cat "$RUNNER_TEMP/model-refresh-pr.md"

      - name: Create or update refresh PR
        id: create-pr
        if: env.ACT != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/refresh-models
          delete-branch: true
          commit-message: 'fix(models): refresh model registries'
          title: 'fix(models): refresh model registries'
          body-path: ${{ runner.temp }}/model-refresh-pr.md
          labels: |
            maintenance
            models

      - name: Dispatch PR validation
        if: env.ACT != 'true' && steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run CI \
            --ref automation/refresh-models \
            -f pr_title='fix(models): refresh model registries'

      - name: Enable auto-merge for refresh PR
        if: env.ACT != 'true' && steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
