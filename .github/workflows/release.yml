name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  prepare-release-pr:
    # Regular main pushes prepare a release PR instead of publishing directly.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore: release v')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure git
        if: env.ACT != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reconcile published package release
        if: env.ACT != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          if ! npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${VERSION} is not published; no release reconciliation needed."
            exit 0
          fi

          if ! git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "${TAG} does not exist; no release reconciliation needed."
            exit 0
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists."
            exit 0
          fi

          git fetch --tags origin
          PREVIOUS_TAG=$(git tag --list 'v*' --sort=-version:refname | grep -v "^${TAG}$" | head -1)

          if [ -z "$PREVIOUS_TAG" ]; then
            COMMIT_RANGE="${TAG}^{}"
          else
            COMMIT_RANGE="${PREVIOUS_TAG}..${TAG}^{}"
          fi

          git log --pretty=format:"%H %s" "$COMMIT_RANGE" > "$RUNNER_TEMP/reconcile-commits.txt"

          pnpm exec tsx scripts/release-plan.ts \
            --current-version "$VERSION" \
            --new-version "$VERSION" \
            --previous-tag "$PREVIOUS_TAG" \
            --commits-file "$RUNNER_TEMP/reconcile-commits.txt" \
            --repository "${{ github.repository }}" \
            --changelog-file "$RUNNER_TEMP/reconcile-changelog.md"

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/reconcile-changelog.md" \
            --verify-tag

      - name: Collect release commits
        id: commits
        env:
          ACT_HEAD_COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          if [ "${ACT:-}" = "true" ]; then
            LATEST_TAG=""
            printf '0000000000000000000000000000000000000000 %s\n' "$ACT_HEAD_COMMIT_MESSAGE" > "$RUNNER_TEMP/release-commits.txt"
          else
            LATEST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -1)

            if [ -z "$LATEST_TAG" ]; then
              COMMIT_RANGE="HEAD"
            else
              COMMIT_RANGE="${LATEST_TAG}..HEAD"
            fi

            git log --pretty=format:"%H %s" "$COMMIT_RANGE" > "$RUNNER_TEMP/release-commits.txt"
          fi

          echo "previous_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "Analyzing commits since ${LATEST_TAG:-beginning}:"
          cat "$RUNNER_TEMP/release-commits.txt"

      - name: Plan release
        id: plan
        run: |
          pnpm exec tsx scripts/release-plan.ts \
            --current-version "$(node -p "require('./package.json').version")" \
            --previous-tag "${{ steps.commits.outputs.previous_tag }}" \
            --commits-file "$RUNNER_TEMP/release-commits.txt" \
            --repository "${{ github.repository }}" \
            --changelog-file "$RUNNER_TEMP/changelog.md"

      - name: Bump package version
        if: steps.plan.outputs.skip != 'true'
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.plan.outputs.new_version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Validate release package
        if: steps.plan.outputs.skip != 'true'
        run: pnpm package:check

      - name: Print release PR summary for local act runs
        if: steps.plan.outputs.skip != 'true' && env.ACT == 'true'
        run: |
          echo "Local act run complete."
          echo "Would create release PR for version: ${{ steps.plan.outputs.new_version }}"
          echo "Would create tag after merge: ${{ steps.plan.outputs.tag }}"
          echo "Generated changelog:"
          cat "$RUNNER_TEMP/changelog.md"

      - name: Create or update release PR
        id: create-pr
        if: steps.plan.outputs.skip != 'true' && env.ACT != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/release
          delete-branch: true
          commit-message: 'chore: release ${{ steps.plan.outputs.tag }}'
          title: 'chore: release ${{ steps.plan.outputs.tag }}'
          body-path: ${{ runner.temp }}/changelog.md
          labels: |
            maintenance
            release

      - name: Dispatch release PR validation
        if: steps.plan.outputs.skip != 'true' && env.ACT != 'true' && steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run CI \
            --ref automation/release \
            -f pr_title='chore: release ${{ steps.plan.outputs.tag }}'

      - name: Enable auto-merge for release PR
        if: steps.plan.outputs.skip != 'true' && env.ACT != 'true' && steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"

  publish-release:
    # Release PR merges publish only after CI has passed on the release commit.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_commit.message, 'chore: release v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure git
        if: env.ACT != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release commit
        id: release
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          FIRST_LINE=$(printf '%s\n' "$HEAD_COMMIT_MESSAGE" | head -1)

          if [[ "$FIRST_LINE" != "chore: release ${TAG}"* ]]; then
            echo "::error::Release commit '${FIRST_LINE}' does not match package version ${VERSION}."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          TAG=${{ steps.release.outputs.tag }}
          PREVIOUS_TAG=$(git tag --list 'v*' --sort=-version:refname | grep -v "^${TAG}$" | head -1)

          if [ -z "$PREVIOUS_TAG" ]; then
            COMMIT_RANGE="HEAD"
          else
            COMMIT_RANGE="${PREVIOUS_TAG}..HEAD"
          fi

          git log --pretty=format:"%H %s" "$COMMIT_RANGE" > "$RUNNER_TEMP/release-commits.txt"

          pnpm exec tsx scripts/release-plan.ts \
            --current-version "${{ steps.release.outputs.version }}" \
            --new-version "${{ steps.release.outputs.version }}" \
            --previous-tag "$PREVIOUS_TAG" \
            --commits-file "$RUNNER_TEMP/release-commits.txt" \
            --repository "${{ github.repository }}" \
            --changelog-file "$RUNNER_TEMP/changelog.md"

          echo "previous_tag=${PREVIOUS_TAG}" >> "$GITHUB_OUTPUT"

      - name: Validate release package
        run: pnpm package:check

      - name: Check npm publication state
        id: npm
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=${{ steps.release.outputs.version }}

          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${VERSION} is already published; skipping npm publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release tag
        if: env.ACT != 'true'
        run: |
          TAG=${{ steps.release.outputs.tag }}
          HEAD_SHA=$(git rev-parse HEAD)
          REMOTE_TAG_SHA=$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | awk '{print $1}')

          if [ -n "$REMOTE_TAG_SHA" ] && [ "$REMOTE_TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::error::Remote tag ${TAG} points to ${REMOTE_TAG_SHA}, expected ${HEAD_SHA}."
            exit 1
          fi

          if [ -z "$REMOTE_TAG_SHA" ]; then
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Create or update draft GitHub Release
        if: env.ACT != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          DRAFT_STATE=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)

          if [ -z "$DRAFT_STATE" ]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/changelog.md" \
              --draft \
              --verify-tag
          elif [ "$DRAFT_STATE" = "true" ]; then
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/changelog.md" \
              --draft
          else
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/changelog.md" \
              --latest
          fi

      - name: Publish to npm
        if: steps.npm.outputs.published != 'true' && env.ACT != 'true'
        run: npx -y npm@11.12.1 publish --provenance --access public

      - name: Publish GitHub Release
        if: env.ACT != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest

      - name: Print release summary for local act runs
        if: env.ACT == 'true'
        run: |
          echo "Local act run complete."
          echo "Would publish version: ${{ steps.release.outputs.version }}"
          echo "Would create or verify tag: ${{ steps.release.outputs.tag }}"
          echo "Generated changelog:"
          cat "$RUNNER_TEMP/changelog.md"
