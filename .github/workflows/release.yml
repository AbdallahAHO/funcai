name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  release:
    # Only run when CI succeeds on a push event (not PRs) and skip release commits
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore: release v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version bump from conventional commits
        id: version
        run: |
          # Find the latest version tag
          LATEST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No existing tags found, using initial commit"
            COMMIT_RANGE="HEAD"
          else
            COMMIT_RANGE="${LATEST_TAG}..HEAD"
          fi

          echo "Analyzing commits in range: ${COMMIT_RANGE}"

          # Extract commit subjects
          COMMITS=$(git log --pretty=format:"%s" ${COMMIT_RANGE})

          if [ -z "$COMMITS" ]; then
            echo "No new commits since ${LATEST_TAG}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "--- Commits since ${LATEST_TAG:-beginning} ---"
          echo "$COMMITS"
          echo "---"

          # Determine bump level
          BUMP="none"

          while IFS= read -r msg; do
            # Check for breaking changes
            if echo "$msg" | grep -qE '^[a-z]+(\(.+\))?!:' || echo "$msg" | grep -qi 'BREAKING CHANGE'; then
              BUMP="major"
              break
            fi

            # Check for features
            if echo "$msg" | grep -qE '^feat(\(.+\))?:'; then
              if [ "$BUMP" != "major" ]; then
                BUMP="minor"
              fi
            fi

            # Check for fixes
            if echo "$msg" | grep -qE '^fix(\(.+\))?:'; then
              if [ "$BUMP" = "none" ]; then
                BUMP="patch"
              fi
            fi
          done <<< "$COMMITS"

          if [ "$BUMP" = "none" ]; then
            echo "No releasable commits (only chore/docs/test/refactor)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "prev_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "Determined bump: ${BUMP}"

      - name: Bump version in package.json
        if: steps.version.outputs.skip != 'true'
        id: bump
        run: |
          BUMP=${{ steps.version.outputs.bump }}
          CURRENT=$(node -p "require('./package.json').version")

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bumping ${CURRENT} → ${NEW_VERSION} (${BUMP})"

          # Update package.json without npm (avoid side effects)
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${NEW_VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        if: steps.version.outputs.skip != 'true'
        id: changelog
        run: |
          PREV_TAG=${{ steps.version.outputs.prev_tag }}
          NEW_VERSION=${{ steps.bump.outputs.new_version }}

          if [ -z "$PREV_TAG" ]; then
            COMMIT_RANGE="HEAD"
          else
            COMMIT_RANGE="${PREV_TAG}..HEAD"
          fi

          # Build changelog grouped by type
          BREAKING=""
          FEATURES=""
          FIXES=""
          OTHER=""

          while IFS= read -r line; do
            HASH=$(echo "$line" | cut -d' ' -f1)
            MSG=$(echo "$line" | cut -d' ' -f2-)
            SHORT_HASH="${HASH:0:7}"

            # Strip conventional commit prefix for display
            CLEAN_MSG=$(echo "$MSG" | sed -E 's/^[a-z]+(\(.+\))?!?:\s*//')

            if echo "$MSG" | grep -qE '^[a-z]+(\(.+\))?!:' || echo "$MSG" | grep -qi 'BREAKING CHANGE'; then
              BREAKING="${BREAKING}- ${CLEAN_MSG} (\`${SHORT_HASH}\`)\n"
            elif echo "$MSG" | grep -qE '^feat(\(.+\))?:'; then
              FEATURES="${FEATURES}- ${CLEAN_MSG} (\`${SHORT_HASH}\`)\n"
            elif echo "$MSG" | grep -qE '^fix(\(.+\))?:'; then
              FIXES="${FIXES}- ${CLEAN_MSG} (\`${SHORT_HASH}\`)\n"
            elif echo "$MSG" | grep -qE '^(perf|refactor)(\(.+\))?:'; then
              OTHER="${OTHER}- ${CLEAN_MSG} (\`${SHORT_HASH}\`)\n"
            fi
          done <<< "$(git log --pretty=format:"%H %s" ${COMMIT_RANGE})"

          # Assemble changelog
          CHANGELOG=""

          if [ -n "$BREAKING" ]; then
            CHANGELOG="${CHANGELOG}### Breaking Changes\n\n${BREAKING}\n"
          fi

          if [ -n "$FEATURES" ]; then
            CHANGELOG="${CHANGELOG}### Features\n\n${FEATURES}\n"
          fi

          if [ -n "$FIXES" ]; then
            CHANGELOG="${CHANGELOG}### Fixes\n\n${FIXES}\n"
          fi

          if [ -n "$OTHER" ]; then
            CHANGELOG="${CHANGELOG}### Other\n\n${OTHER}\n"
          fi

          if [ -n "$PREV_TAG" ]; then
            CHANGELOG="${CHANGELOG}**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${NEW_VERSION}"
          fi

          # Write to file (avoids multi-line output variable issues)
          echo -e "$CHANGELOG" > /tmp/changelog.md

          echo "Generated changelog:"
          cat /tmp/changelog.md

      - uses: pnpm/action-setup@v4
        if: steps.version.outputs.skip != 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.version.outputs.skip != 'true'
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install and build
        if: steps.version.outputs.skip != 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Publish to npm
        if: steps.version.outputs.skip != 'true'
        run: pnpm publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit, tag, and push
        if: steps.version.outputs.skip != 'true'
        run: |
          TAG=${{ steps.bump.outputs.tag }}
          NEW_VERSION=${{ steps.bump.outputs.new_version }}

          git add package.json
          git commit -m "chore: release v${NEW_VERSION}"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin main --follow-tags

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          body_path: /tmp/changelog.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
